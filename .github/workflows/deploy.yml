name: ci-docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dockerhub-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: DockerHub
    env:
      DOCKERHUB_REPONAME: dc-kos-toolchain-rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GCC and the Rust sysroot need more free space than the default image leaves.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: JOBS=2
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPONAME }}:latest

      - name: README to Docker Hub
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          destination_container_repo: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPONAME }}
          provider: dockerhub
          short_description: KallistiOS toolchain with Rust for Dreamcast
          readme_file: README.md
